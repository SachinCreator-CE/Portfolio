<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--paper:#F3EFE6;--ink:#0648DA;--graphite:#465069;--rule:rgba(6,72,218,.16);--rule-strong:rgba(6,72,218,.42);--grid:rgba(6,72,218,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0E2C6B;--ink:#F1EBDD;--graphite:#B6C4E8;--rule:rgba(241,235,221,.17);--rule-strong:rgba(241,235,221,.46);--grid:rgba(241,235,221,.055);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:48px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:"Geist","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(1100px,100%);margin:0 auto}
.tag{font:500 10px/1.2 "Geist Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
h1{margin:18px 0 0;font:300 clamp(54px,10vw,140px)/.92 "Newsreader",Georgia,serif;letter-spacing:-.04em}
h1 em{font-style:italic}
p{max-width:36ch;margin:24px 0 0;font-size:18px;line-height:1.6;color:var(--graphite)}
svg{display:block;width:100%;height:auto;margin-top:44px}
svg .ln{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
svg .prop{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:6 6;opacity:.45}
svg .thin{fill:none;stroke:var(--ink);stroke-width:.8;opacity:.5}
svg text{font:italic 16px "Newsreader",Georgia,serif;fill:var(--graphite)}
a{display:inline-flex;align-items:center;gap:14px;margin-top:36px;min-height:52px;padding:0 24px;background:var(--ink);color:var(--paper);font:500 15px "Geist","Inter",system-ui,sans-serif;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
<main>
  <span class="tag">Error 404 · Sheet not in the set</span>
  <h1>Sheet not found.<br><em>This span was never drawn.</em></h1>
  <p>The page you asked for isn’t part of this drawing set. It may have moved, or the link has a typo.</p>
  <svg viewBox="0 0 1000 180" aria-hidden="true">
    <path class="thin" d="M0 160H1000"/>
    <path class="ln" d="M60 100H420M580 100H940M60 112H420M580 112H940"/>
    <path class="prop" d="M420 100H580M420 112H580"/>
    <path class="ln" d="M120 112V160M300 112V160M700 112V160M880 112V160M420 100V112M580 100V112"/>
    <text x="500" y="88" text-anchor="middle">missing span</text>
  </svg>
  <a href="/">Back to sheet 01</a>
</main>
</body>
</html>
